<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Problem Reader</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1b1f24; --muted: #5d6673; --line: #e2e5ea;
  --accent: #2563eb; --accent-soft: #dbe6fd; --bar: #93b4f5; --bad: #b42318; --chip: #eef2f7;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0f1216; --panel: #171b21; --ink: #e6e9ee; --muted: #9aa4b2; --line: #2a313b;
          --accent: #6ea0ff; --accent-soft: #1d2a44; --bar: #35558f; --bad: #ff8a80; --chip: #222833; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button { font: inherit; color: inherit; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px; margin-bottom: 12px; }
h1 { font-size: 20px; margin: 0; }
.muted { color: var(--muted); font-size: 13px; }
#login { max-width: 360px; margin: 12vh auto; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
#login label { display: block; font-size: 13px; color: var(--muted); margin-top: 12px; }
#login input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); color: var(--ink); font: inherit; }
#login button { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
#err { color: var(--bad); font-size: 13px; min-height: 1.5em; margin-top: 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 12px; min-height: 30px; align-items: center; }
.chip { background: var(--accent-soft); border: 0; border-radius: 999px; padding: 4px 10px; cursor: pointer; font-size: 13px; }
.chip b { font-weight: 600; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 14px; }
.kpi { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; text-align: left; cursor: pointer; }
.kpi .n { font-size: 24px; font-weight: 650; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px; min-width: 0; }
.card h2 { font-size: 14px; margin: 0 0 8px; display: flex; justify-content: space-between; gap: 8px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; padding: 4px 6px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 6px; position: relative; }
.row:hover, .row:focus-visible { background: var(--chip); outline: none; }
.row .bar { position: absolute; left: 0; top: 0; bottom: 0; background: var(--accent-soft); border-radius: 6px; z-index: 0; }
.row span { position: relative; z-index: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .c { font-variant-numeric: tabular-nums; }
.more { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 4px 6px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
td.q { min-width: 260px; }
.tag { border: 0; background: var(--chip); border-radius: 6px; padding: 1px 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
a { color: var(--accent); }
.scroll { overflow-x: auto; }
.note { font-size: 13px; color: var(--muted); margin: 12px 0; }
@media (max-width: 640px) { .hide-sm { display: none; } td.q { min-width: 200px; } }
</style>
</head>
<body>
<form id="login" autocomplete="on">
  <h1>Problem Reader</h1>
  <div class="muted">Reported economic and public-service problems, Uzbekistan</div>
  <label>Username<input id="u" name="username" autocomplete="username" required></label>
  <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit" id="go">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<div id="app" class="wrap" hidden>
  <header><h1>Problem Reader</h1><span class="muted" id="meta"></span></header>
  <div class="chips" id="chips"></div>
  <div class="kpis" id="kpis"></div>
  <div class="grid" id="panels"></div>
  <div class="card" style="margin-top:12px">
    <h2><span id="rtitle">Records</span><span class="muted" id="rcount"></span></h2>
    <div class="scroll"><table><thead><tr><th>Date</th><th>Channel</th><th>Sector</th><th class="hide-sm">Service / failure</th><th>Quote</th><th>Post</th></tr></thead><tbody id="rows"></tbody></table></div>
    <button class="more" id="morerows" hidden>Show 50 more</button>
  </div>
  <div class="card" style="margin-top:12px"><h2>How to read this</h2><div class="note" id="method"></div><div class="scroll" id="checks"></div></div>
</div>

const F = {month: 0, week: 1, day: 2, channel: 3, msg: 4, sector: 5, service: 6, failure: 7, institution: 8, affected: 9, location: 10, quote: 11, check: 13};
const DIMS = [['check', 'Second check'], ['month', 'Month'], ['week', 'Week (Tashkent)'], ['sector', 'Institutional sector'], ['channel', 'Channel'],
              ['service', 'Service'], ['institution', 'Institution'], ['location', 'Location'], ['affected', 'Affected group'], ['failure', 'Failure mode']];
let D, filters = {check: 'kept'}, shown = 50, expanded = {};

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(user, pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user + ':' + pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(SEALED.salt), iterations: SEALED.iterations, hash: 'SHA-256'},
                                            base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(SEALED.iv)}, key, b64(SEALED.data));
  const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
  return JSON.parse(text);
}
document.getElementById('login').addEventListener('submit', async e => {
  e.preventDefault();
  const err = document.getElementById('err'), go = document.getElementById('go');
  go.disabled = true; err.textContent = 'Checking…';
  try {
    D = await unlock(document.getElementById('u').value.trim(), document.getElementById('p').value);
    err.textContent = ''; document.getElementById('login').hidden = true; document.getElementById('app').hidden = false; render();
  } catch (e) { err.textContent = e && e.name === 'OperationError' ? 'Wrong username or password.' : 'Could not open the report: ' + e; console.error(e); }
  go.disabled = false;
});

const label = (dim, v) => v === '' ? '(not stated)' : dim === 'sector' ? `${v} ${D.sectors[v] || ''}` : v;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;'}[c]));
const key = (dim, r) => dim === 'service' || dim === 'failure' || dim === 'institution' || dim === 'location' || dim === 'affected' ? r[F[dim]].toLowerCase() : r[F[dim]];
const match = r => Object.entries(filters).every(([d, v]) => key(d, r) === v);
function setFilter(dim, v) { filters[dim] = v; shown = 50; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }

function postsRead() {  // posts read under the month/week/channel filters; other filters do not change the denominator
  let n = 0;
  for (const [k, c] of Object.entries(D.read)) {
    const [month, week, channel] = k.split('|');
    if ((!filters.month || filters.month === month) && (!filters.week || filters.week === week) && (!filters.channel || filters.channel === channel)) n += c;
  }
  return n;
}

function render() {
  const rs = D.records.filter(match);
  document.getElementById('meta').textContent = `Updated ${D.generated} · model ${D.models.join(', ')}`;
  const chips = document.getElementById('chips');
  chips.innerHTML = Object.keys(filters).length ? '' : '<span class="muted">Click any number or value to drill down. Filters appear here.</span>';
  for (const [d, v] of Object.entries(filters)) {
    const b = document.createElement('button'); b.className = 'chip';
    b.innerHTML = `${esc(DIMS.find(x => x[0] === d)[1])}: <b>${esc(label(d, v))}</b> ✕`;
    b.onclick = () => { delete filters[d]; shown = 50; render(); }; chips.append(b);
  }
  if (Object.keys(filters).length > 1) {
    const b = document.createElement('button'); b.className = 'more'; b.textContent = 'Clear all';
    b.onclick = () => { filters = {}; render(); }; chips.append(b);
  }
  const read = postsRead(), postsWith = new Set(rs.map(r => r[F.channel] + '/' + r[F.msg])).size;
  const kp = [['Problems', rs.length, 'records'], ['Posts with a problem', postsWith, 'records'], ['Posts read', read, null],
              ['Problems per 100 posts', read ? (100 * rs.length / read).toFixed(1) : '–', null]];
  document.getElementById('kpis').innerHTML = kp.map(([t, n, go]) =>
    `<button class="kpi" ${go ? 'data-go="1"' : ''}><div class="muted">${t}</div><div class="n">${n.toLocaleString ? n.toLocaleString() : n}</div></button>`).join('');
  document.querySelectorAll('.kpi[data-go]').forEach(k => k.onclick = () => document.getElementById('rtitle').scrollIntoView({behavior: 'smooth'}));

  const panels = document.getElementById('panels'); panels.innerHTML = '';
  for (const [dim, title] of DIMS) {
    if (filters[dim] !== undefined) continue;
    const counts = new Map();
    for (const r of rs) counts.set(key(dim, r), (counts.get(key(dim, r)) || 0) + 1);
    if (!counts.size) continue;
    let items = [...counts.entries()];
    items.sort(dim === 'month' || dim === 'week' ? (a, b) => a[0] < b[0] ? -1 : 1 : (a, b) => b[1] - a[1]);
    const max = Math.max(...items.map(i => i[1])), limit = expanded[dim] ? items.length : 8;
    const card = document.createElement('div'); card.className = 'card';
    card.innerHTML = `<h2><span>${esc(title)}</span><span class="muted">${items.length} values</span></h2>`;
    for (const [v, c] of items.slice(0, limit)) {
      const b = document.createElement('button'); b.className = 'row'; b.title = label(dim, v);
      b.innerHTML = `<i class="bar" style="width:${(100 * c / max).toFixed(1)}%"></i><span>${esc(label(dim, v))}</span><span class="c">${c}</span>`;
      b.onclick = () => setFilter(dim, v); card.append(b);
    }
    if (items.length > 8) {
      const m = document.createElement('button'); m.className = 'more';
      m.textContent = expanded[dim] ? 'Show fewer' : `Show all ${items.length}`;
      m.onclick = () => { expanded[dim] = !expanded[dim]; render(); }; card.append(m);
    }
    panels.append(card);
  }

  const sorted = rs.slice().sort((a, b) => a[F.day] < b[F.day] ? 1 : -1);
  document.getElementById('rcount').textContent = `${rs.length.toLocaleString()} shown newest first`;
  document.getElementById('rows').innerHTML = sorted.slice(0, shown).map(r => `<tr>
    <td>${r[F.day]}</td>
    <td><button class="tag" data-d="channel" data-v="${esc(r[F.channel])}">${esc(r[F.channel])}</button></td>
    <td><button class="tag" data-d="sector" data-v="${esc(r[F.sector])}">${esc(r[F.sector])}</button></td>
    <td class="hide-sm">${esc(r[F.service])}${r[F.failure] ? '<div class="muted">' + esc(r[F.failure]) + '</div>' : ''}</td>
    <td class="q">${esc(r[F.quote])}</td>
    <td><a href="https://t.me/${encodeURIComponent(r[F.channel])}/${r[F.msg]}" target="_blank" rel="noopener noreferrer">open</a></td></tr>`).join('');
  document.querySelectorAll('#rows .tag').forEach(t => t.onclick = () => setFilter(t.dataset.d, t.dataset.v));
  const more = document.getElementById('morerows'); more.hidden = shown >= rs.length;
  more.onclick = () => { shown += 50; render(); };

  document.getElementById('method').textContent =
    'Each record is a passage quoted exactly from a Telegram channel post and labelled by a language model with the IMF institutional sector of the institution the post implicates. ' +
    'A record reports what a channel published; it does not establish that the event occurred. Counts reflect what these channels chose to publish, and the three largest channels supply about two thirds of posts, so counts are not a measure of how often problems happen. ' +
    'Service, institution and location are the model’s own wording, so similar values can appear separately. ' +
    'A second pass by the same model checks every record against the definition and drops crimes other than fraud or bribery, accidents, warnings, events outside Uzbekistan, announced rules without reported harm, and statements without a concrete difficulty. ' +
    'The view starts with kept records only; remove the “Second check: kept” filter to see dropped records and their reasons. ' +
    'On 100 randomly drawn September records reviewed by Claude (not a human reviewer), 70 met the definition before the check; after it, 55 of 57 kept records did, while 15 correct records were dropped, mostly borderline cases. ' +
    'The table compares post-level extraction with posts labelled by Claude.';
  document.getElementById('checks').innerHTML = '<table><thead><tr><th>Sample</th><th>Posts</th><th>Positive</th><th>Precision</th><th>Recall</th></tr></thead><tbody>' +
    D.checks.map(c => `<tr><td>${esc(c.sample)}</td><td>${c.posts}</td><td>${c.positive}</td><td>${c.tp + c.fp ? (c.tp / (c.tp + c.fp)).toFixed(2) : '–'}</td><td>${c.tp + c.fn ? (c.tp / (c.tp + c.fn)).toFixed(2) : '–'}</td></tr>`).join('') + '</tbody></table>';
}
</script>
</body>
</html>
