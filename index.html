<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>thEye</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --other: #c3c2b7; --mag: #6250d6; --accent: #2a78d6; --bad: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --other: #4a4a46; --mag: #9085e9; --accent: #3987e5; --bad: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --other: #4a4a46; --mag: #9085e9; --accent: #3987e5; --bad: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
h1 { font-size: 22px; margin: 0; letter-spacing: 0.2px; }
.muted { color: var(--muted); font-size: 13px; }
.sub { color: var(--ink-2); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; min-width: 0; }
#login { max-width: 360px; margin: 12vh auto; }
#login label { display: block; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
#login input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--ring); border-radius: 8px; background: var(--page); }
#login button { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
#err { color: var(--bad); font-size: 13px; min-height: 1.5em; margin-top: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.filters label { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.filters select { padding: 5px 8px; border: 1px solid var(--ring); border-radius: 8px; background: var(--surface); }
.chip { background: var(--wash); border: 1px solid var(--ring); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.chip b { font-weight: 600; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 2px 4px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi .label { font-size: 13px; color: var(--ink-2); }
.kpi .value { font-size: 28px; font-weight: 600; line-height: 1.2; }
.kpi .note { font-size: 12px; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 12px; margin-bottom: 12px; }
.chart h2, .list h2, .records h2 { font-size: 15px; margin: 0; font-weight: 600; }
.chart .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.chart .cap { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .lab { fill: var(--ink-2); font-size: 12px; font-variant-numeric: normal; }
svg .val { fill: var(--ink-2); font-size: 11px; }
svg .mark { cursor: pointer; }
svg g:has(.mark:hover) path, svg g:has(.mark:focus) path { opacity: .8; }
svg .mark:focus { outline: none; }
svg .dim { opacity: .35; }
.tview { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.tview th, .tview td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--grid); }
.tview td.n { text-align: right; font-variant-numeric: tabular-nums; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 280px; }
#tip .v { font-weight: 600; font-size: 15px; color: var(--ink); }
#tip .k { color: var(--ink-2); }
#tip .trow { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
#tip .key { display: inline-block; width: 12px; height: 2px; margin-right: 6px; vertical-align: middle; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
@media (max-width: 640px) { .split { grid-template-columns: 1fr; } }
.party { text-align: left; cursor: pointer; }
.party.on { box-shadow: 0 0 0 2px var(--accent) inset; }
.party.off { opacity: .55; }
.party .phead { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.party .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.party .value { font-size: 40px; font-weight: 600; line-height: 1.15; }
.party .note { font-size: 13px; color: var(--ink-2); }
.party .top { font-size: 12px; color: var(--muted); margin-top: 4px; }
.split .rest { grid-column: 1 / -1; }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-bottom: 12px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; padding: 3px 6px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 6px; position: relative; }
.lists .row:hover, .lists .row:focus-visible { background: var(--wash); outline: none; }
.row .bar { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--wash); border-radius: 4px; }
.row span { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .c { font-variant-numeric: tabular-nums; color: var(--ink-2); }
table.rec { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rec th, table.rec td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--grid); vertical-align: top; }
table.rec th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
td.q { min-width: 260px; }
table.rec td:first-child { white-space: nowrap; }
.tag { border: 1px solid var(--ring); background: var(--wash); border-radius: 6px; padding: 0 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
a { color: var(--accent); }
.scroll { overflow-x: auto; }
.note { font-size: 13px; color: var(--ink-2); margin: 8px 0; }
@media (max-width: 640px) { .hide-sm { display: none; } td.q { min-width: 200px; } }
.mult { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 220px), 1fr)); gap: 10px; }
.mini { border: 1px solid var(--ring); border-radius: 10px; padding: 8px 10px; cursor: pointer; background: none; text-align: left; }
.mini.on { box-shadow: 0 0 0 2px var(--accent) inset; }
.mini.off { opacity: .5; }
.mini .t { font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 6px; }
.mini .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.badge { flex-shrink: 0; background: var(--bad); color: #fff; border-radius: 999px; padding: 0 7px; font-size: 11px; font-weight: 600; white-space: nowrap; }
.mapside { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tm text { fill: #fff; font-size: 11px; pointer-events: none; }
.tm .grp { fill: var(--ink-2); font-size: 11px; font-weight: 600; }
@media print { .filters, #morerows, .linkbtn { display: none; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<form id="login" class="card" autocomplete="on">
  <h1>thEye</h1>
  <div class="sub">Reported economic and public-service problems in Uzbekistan</div>
  <label>Username<input id="u" name="username" autocomplete="username" required></label>
  <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit" id="go">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<div id="app" class="wrap" hidden>
  <header><h1>thEye</h1><span class="sub">Reported economic and public-service problems in Uzbekistan, counted as stories</span><span class="muted" id="meta"></span></header>
  <div class="filters" id="filters"></div>
  <div class="kpis" id="kpis"></div>
  <section class="card chart" id="c-spike" style="margin-bottom:12px"></section>
  <div class="charts">
    <section class="card chart" id="c-owner"></section>
    <section class="card chart" id="c-map"></section>
  </div>
  <div class="split" id="split"></div>
  <section class="card chart" id="c-foreign" style="margin-bottom:12px"></section>
  <section class="card records">
    <div class="chart"><div class="head"><h2>Stories</h2><span class="muted" id="rcount"></span></div></div>
    <div class="scroll"><table class="rec"><thead><tr><th>Date</th><th>Owner</th><th class="hide-sm">Region</th><th>Affected</th><th>Channels</th><th>Quote</th><th>Posts</th></tr></thead><tbody id="rows"></tbody></table></div>
    <button class="linkbtn" id="morerows" hidden>Show 50 more</button>
  </section>
  <section class="card" style="margin-top:12px"><h2 style="font-size:15px;margin:0">How to read this</h2><div class="note" id="method"></div><div class="scroll" id="checks"></div></section>
</div>
<div id="tip" hidden></div>

    OWN = new Map(D.owners.map(o => [o.id, o]));
    err.textContent = ''; document.getElementById('login').hidden = true; document.getElementById('app').hidden = false; render();
  } catch (e) { err.textContent = e && e.name === 'OperationError' ? 'Wrong username or password.' : 'Could not open the report: ' + e; console.error(e); }
  go.disabled = false;
});

// ---------- data helpers ----------
const ownerName = id => id === 'unclear' ? 'Owner unclear' : (OWN.get(id) || {}).name_en || id;
const branchOf = id => { let o = OWN.get(id); if (!o) return 'unclear'; while (o.parent) o = OWN.get(o.parent); return o.id; };
const value = (dim, r) => dim === 'strength' ? r.link_strength : r[dim];
const matches = (dim, v, r) => dim === 'channel' ? r.links.some(l => l.split('/')[0] === v) : value(dim, r) === v;
const rowsExcept = (...skip) => D.stories.filter(r => Object.entries(filters).every(([d, v]) => skip.includes(d) || matches(d, v, r)));
// Rows are story-owner pairs (a story with two owners appears under each); views other than owner count each story once.
const uniq = rows => [...new Map(rows.map(r => [r.story, r])).values()];
const countBy = (rows, dim) => { const m = new Map(); for (const r of rows) m.set(value(dim, r), (m.get(value(dim, r)) || 0) + 1); return m; };
const label = (dim, v) => dim === 'area' || dim === 'owner' ? ownerName(v) : dim === 'region' ? REGION_NAME[v] || v : dim === 'party' ? PARTY_NAME[v]
  : dim === 'week' ? `week of ${v}` : v === '' ? '(none)' : v;
function weekInfo(monday) {  // days of the calendar week inside the collected span
  const start = new Date(monday + 'T00:00:00Z'), first = new Date(D.span[0] + 'T00:00:00Z'), last = new Date(D.span[1] + 'T00:00:00Z');
  const end = new Date(start); end.setUTCDate(end.getUTCDate() + 6);
  const days = Math.max(0, (Math.min(end, last) - Math.max(start, first)) / 864e5 + 1);
  return {days, partial: days < 7};
}
// Same rule as reader/series.py: at least 4 earlier full weeks, count >= 3 and above their mean + 2*sqrt(mean).
// Partly collected weeks (D.partial) stay out of the baseline and are never flagged.
const spikeFlags = counts => counts.map((c, t) => {
  if (D.partial[t]) return false;
  const earlier = counts.slice(0, t).filter((_, i) => !D.partial[i]);
  if (earlier.length < 4) return false;
  const m = earlier.reduce((a, b) => a + b, 0) / earlier.length;
  return c >= 3 && c > m + 2 * Math.sqrt(m);
});
const fullWeeks = () => D.weeks.filter((_, i) => !D.partial[i]);
const weekly = rows => { const c = D.weeks.map(() => 0); for (const r of rows) { const i = D.weeks.indexOf(r.week); if (i >= 0) c[i]++; } return c; };
const fmt = n => n >= 1e4 ? (n / 1e3).toFixed(0) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K' : String(Math.round(n * 10) / 10);
const niceMax = v => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)), s = [1, 2, 2.5, 5, 10].find(m => m * p >= v); return s * p; };
function toggle(dim, v) { if (filters[dim] === v) delete filters[dim]; else filters[dim] = v; shown = 50; render(); }

// ---------- tooltip ----------
const tip = document.getElementById('tip');
function showTip(ev, value, title, rows) {
  tip.replaceChildren();
  const v = document.createElement('div'); v.className = 'v'; v.textContent = value; tip.append(v);
  const t = document.createElement('div'); t.className = 'k'; t.textContent = title; tip.append(t);
  for (const [color, name, val] of rows || []) {
    const row = document.createElement('div'); row.className = 'trow';
    const left = document.createElement('span'); const k = document.createElement('i'); k.className = 'key'; k.style.background = color;
    left.append(k, document.createTextNode(name)); const right = document.createElement('b'); right.textContent = val;
    row.append(left, right); tip.append(row);
  }
  tip.hidden = false;
  const box = ev.target.getBoundingClientRect();
  const x = ev.clientX || (box.left + box.width / 2), y = ev.clientY || box.top;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + 'px';
  tip.style.top = (y - h - 12 < 8 ? y + 16 : y - h - 12) + 'px';
}
const hideTip = () => { tip.hidden = true; };
const NS = 'http://www.w3.org/2000/svg';
const el = (name, attrs = {}, text) => { const n = document.createElementNS(NS, name); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text != null) n.textContent = text; return n; };
const h = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };
// Bar with a 4px rounded data end and a square baseline end.
function barPath(x, y, w, h, horizontal, rounded = true) {
  if (w <= 0 || h <= 0) return '';
  const r = rounded ? Math.min(4, w / 2, h / 2) : 0;
  return horizontal
    ? `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`
    : `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function interactive(node, dim, value, tipArgs) {
  node.classList.add('mark'); node.setAttribute('tabindex', '0'); node.setAttribute('role', 'button');
  node.setAttribute('aria-label', `${tipArgs[1]}: ${tipArgs[0]}. Activate to filter.`);
  node.addEventListener('pointermove', ev => showTip(ev, ...tipArgs));
  node.addEventListener('pointerleave', hideTip); node.addEventListener('blur', hideTip);
  node.addEventListener('focus', ev => showTip(ev, ...tipArgs));
  node.addEventListener('click', ev => { ev.stopPropagation(); hideTip(); toggle(dim, value); });
  node.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); hideTip(); toggle(dim, value); } });
}
// Card with title, caption, legend and a chart/table toggle (the table is the accessible twin of the chart).
function chartShell(id, title, caption, legend, table) {
  const box = document.getElementById(id); box.replaceChildren();
  const head = h('div', 'head');
  const btn = h('button', 'linkbtn', tables[id] ? 'Show chart' : 'Show table');
  btn.onclick = () => { tables[id] = !tables[id]; render(); };
  head.append(h('h2', null, title), btn);
  box.append(head, h('div', 'cap', caption));
  if (legend) {
    const lg = h('div', 'legend');
    for (const [color, name] of legend) { const s = h('span'); const i = h('i'); i.style.background = color; s.append(i, document.createTextNode(name)); lg.append(s); }
    box.append(lg);
  }
  if (tables[id]) {
    const t = h('table', 'tview');
    const hr = h('tr'); for (const c of table.head) hr.append(h('th', null, c));
    t.append(hr);
    for (const row of table.rows) { const tr = h('tr'); row.forEach((c, i) => tr.append(h('td', i ? 'n' : null, c))); t.append(tr); }
    box.append(t); return null;
  }
  return box;
}

// ---------- spike panel: one small chart per problem area ----------
function spikePanel() {
  const rows = rowsExcept('week', 'area');
  const full = fullWeeks(), lastFull = full[full.length - 1];
  const areas = [...countBy(rows, 'area')].sort((a, b) => b[1] - a[1]);
  const data = areas.map(([a]) => { const c = weekly(rows.filter(r => r.area === a)); return [a, c, spikeFlags(c)]; });
  const base = Math.max(0, full.length - 1);
  const box = chartShell('c-spike', 'Weekly stories by problem area, with spikes',
    `Each panel is the ministry-level body that owns the problems. Columns are stories per week (Monday start, Tashkent); a story carried by several channels counts once. ` +
    `Red marks a spike: at least 4 earlier full weeks, 3 or more stories, and above the earlier full-week mean plus two standard deviations (Poisson). ` +
    `Baseline for the latest full week: ${base} earlier full weeks${base < 8 ? ', short, so read flags as prompts to look rather than findings' : ''}. Faded columns are weeks only partly collected; they are left out of the baseline. Click a panel or a column to filter.`,
    [['var(--s1)', 'Stories'], ['var(--bad)', 'Spike week']],
    {head: ['Area', ...D.weeks.map(w => w.slice(5)), 'Spike in latest full week'], rows: data.map(([a, c, f]) => [ownerName(a), ...c, f[D.weeks.indexOf(lastFull)] ? 'yes' : ''])});
  if (!box) return;
  const grid = h('div', 'mult');
  for (const [a, counts, flags] of data.slice(0, 24)) {
    const on = filters.area === a, card = h('button', 'mini' + (on ? ' on' : '') + (filters.area && !on ? ' off' : ''));
    const t = h('div', 't'); t.append(h('span', null, ownerName(a)));
    const total = counts.reduce((x, y) => x + y, 0), spikeNow = flags[D.weeks.indexOf(lastFull)];
    t.append(spikeNow ? h('span', 'badge', 'spike') : h('span', 'muted', String(total)));
    card.append(t);
    const W = 200, H = 54, max = niceMax(Math.max(3, ...counts)), bw = W / D.weeks.length;
    const svg = el('svg', {viewBox: `0 0 ${W} ${H + 12}`, height: H + 12, role: 'img', 'aria-label': `${ownerName(a)} weekly stories`});
    counts.forEach((c, i) => {
      const w = D.weeks[i], info = {...weekInfo(w), partial: D.partial[i]}, bh = H * c / max;
      const g = el('g'); if (filters.week && filters.week !== w) g.setAttribute('class', 'dim');
      if (c) g.append(el('path', {d: barPath(i * bw + 1.5, H - bh, bw - 3, bh, false), fill: flags[i] ? 'var(--bad)' : 'var(--s1)', opacity: info.partial ? 0.4 : 1}));
      const hit = el('rect', {x: i * bw, y: 0, width: bw, height: H + 12, fill: 'transparent'});
      interactive(hit, 'week', w, [`${c} stories`, `${ownerName(a)} · week of ${w}${info.partial ? ` (partial: ${info.days} of 7 days)` : ''}${flags[i] ? ' · spike' : ''}`]);
      g.append(hit); svg.append(g);
    });
    svg.append(el('line', {x1: 0, x2: W, y1: H, y2: H, stroke: 'var(--axis)'}));
    svg.append(el('text', {x: 0, y: H + 11}, D.weeks[0].slice(5)), el('text', {x: W, y: H + 11, 'text-anchor': 'end'}, D.weeks[D.weeks.length - 1].slice(5)));
    card.append(svg);
    card.onclick = () => toggle('area', a);
    grid.append(card);
  }
  box.append(grid);
  if (data.length > 24) box.append(h('div', 'muted', `${data.length - 24} smaller areas not shown; use the table view.`));
}

// ---------- owner decomposition: branch > ministry-level area > body ----------
function ownerTreemap() {
  const rows = rowsExcept('owner', 'area'), counts = countBy(rows, 'owner');
  const items = [...counts].map(([o, n]) => ({o, n, area: rows.find(r => r.owner === o).area, branch: branchOf(o)}));
  const box = chartShell('c-owner', 'Who owns the problems', 'Stories by the government body expected to solve them, nested branch › ministry-level body › subordinate body (official 2026 structure). Tile area = stories. Labels are the model’s reading and are not human-checked. Click a tile to filter.',
    [...new Set(items.map(i => i.branch))].map(b => [BRANCH_COLOR[b] || 'var(--other)', b === 'unclear' ? 'Owner unclear' : ownerName(b)]),
    {head: ['Owner', 'Ministry-level body', 'Stories'], rows: items.sort((a, b) => b.n - a.n).map(i => [ownerName(i.o), ownerName(i.area), i.n])});
  if (!box || !items.length || !window.d3) return;
  const W = Math.max(300, box.clientWidth - 32), H = 340;
  const nest = {id: 'root', children: d3.groups(items, i => i.branch).map(([b, xs]) => ({id: b, children: d3.groups(xs, i => i.area).map(([a, ys]) => ({id: a, children: ys.map(y => ({id: y.o, n: y.n, area: a, branch: b}))}))}))};
  const root = d3.treemap().size([W, H]).paddingInner(2).paddingTop(d => d.depth === 2 ? 14 : 0).round(true)(d3.hierarchy(nest).sum(d => d.n || 0).sort((a, b) => b.value - a.value));
  const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, height: H, class: 'tm', role: 'img', 'aria-label': 'Treemap of stories by owner'});
  for (const g of root.descendants().filter(d => d.depth === 2 && d.y1 - d.y0 > 18 && d.x1 - d.x0 > 40))
    svg.append(el('text', {x: g.x0 + 3, y: g.y0 + 11, class: 'grp'}, ownerName(g.data.id).slice(0, Math.floor((g.x1 - g.x0) / 6.5))));
  for (const leaf of root.leaves()) {
    const {id, n, area, branch} = leaf.data, w = leaf.x1 - leaf.x0, ht = leaf.y1 - leaf.y0;
    const g = el('g'); if (filters.owner && filters.owner !== id) g.setAttribute('class', 'dim');
    const rect = el('rect', {x: leaf.x0, y: leaf.y0, width: w, height: ht, rx: 3, fill: BRANCH_COLOR[branch] || 'var(--other)'});
    interactive(rect, 'owner', id, [`${n} stories`, `${ownerName(id)}${area !== id ? ' · under ' + ownerName(area) : ''}`]);
    g.append(rect);
    if (w > 44 && ht > 16) g.append(el('text', {x: leaf.x0 + 4, y: leaf.y0 + 13}, `${ownerName(id).slice(0, Math.floor((w - 8) / 6.2))} ${n}`));
    svg.append(g);
  }
  box.append(svg);
}

function render() {
  const rs = D.stories.filter(r => Object.entries(filters).every(([d, v]) => matches(d, v, r)));
  document.getElementById('meta').textContent = `Updated ${D.generated} · model ${D.models.join(', ')}`;
  const waiting = [D.unclassified ? `${D.unclassified} stories wait for extraction` : '', D.unlabelled ? `${D.unlabelled} records wait for the label pass` : ''].filter(Boolean);
  if (waiting.length) document.getElementById('meta').textContent += ` · Incomplete: ${waiting.join(', ')}; their weeks are faded and not flagged`;

  const fr = document.getElementById('filters'); fr.replaceChildren();
  for (const [d, v] of Object.entries(filters)) {
    const b = h('button', 'chip'); b.append(document.createTextNode(NAMES[d] + ': '), h('b', null, label(d, v)), document.createTextNode(' ✕'));

    td(r.day); td(tag('owner', ownerName(r.owner))); td(tag('region', REGION_NAME[r.region] || r.region), 'hide-sm'); td(tag('party', PARTY_NAME[r.party], PARTY_COLOR[r.party]));
