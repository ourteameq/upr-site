<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>thEye</title>
<style>
:root {
  color-scheme: light;
  --page: #f9f9f7; --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
  --grid: #e1e0d9; --axis: #c3c2b7; --ring: rgba(11,11,11,0.10); --wash: rgba(11,11,11,0.04);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --other: #c3c2b7; --mag: #6250d6; --accent: #2a78d6; --bad: #d03b3b;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
    --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --other: #4a4a46; --mag: #9085e9; --accent: #3987e5; --bad: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0d0d0d; --surface: #1a1a19; --ink: #f0efec; --ink-2: #c3c2b7; --muted: #898781;
  --grid: #2c2c2a; --axis: #383835; --ring: rgba(255,255,255,0.10); --wash: rgba(255,255,255,0.05);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --other: #4a4a46; --mag: #9085e9; --accent: #3987e5; --bad: #e66767;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, select, input { font: inherit; color: inherit; }
.wrap { max-width: 1240px; margin: 0 auto; padding: 16px; }
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; margin-bottom: 12px; }
h1 { font-size: 22px; margin: 0; letter-spacing: 0.2px; }
.muted { color: var(--muted); font-size: 13px; }
.sub { color: var(--ink-2); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--ring); border-radius: 12px; padding: 14px 16px; min-width: 0; }
#login { max-width: 360px; margin: 12vh auto; }
#login label { display: block; font-size: 13px; color: var(--ink-2); margin-top: 12px; }
#login input { width: 100%; padding: 10px; margin-top: 4px; border: 1px solid var(--ring); border-radius: 8px; background: var(--page); }
#login button { width: 100%; margin-top: 16px; padding: 10px; border: 0; border-radius: 8px; background: var(--accent); color: #fff; cursor: pointer; }
#err { color: var(--bad); font-size: 13px; min-height: 1.5em; margin-top: 8px; }
.filters { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; margin-bottom: 12px; }
.filters label { font-size: 13px; color: var(--ink-2); display: flex; gap: 6px; align-items: center; }
.filters select { padding: 5px 8px; border: 1px solid var(--ring); border-radius: 8px; background: var(--surface); }
.chip { background: var(--wash); border: 1px solid var(--ring); border-radius: 999px; padding: 3px 10px; cursor: pointer; font-size: 13px; }
.chip b { font-weight: 600; }
.linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; font-size: 13px; padding: 2px 4px; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 12px; }
.kpi .label { font-size: 13px; color: var(--ink-2); }
.kpi .value { font-size: 28px; font-weight: 600; line-height: 1.2; }
.kpi .note { font-size: 12px; color: var(--muted); }
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 520px), 1fr)); gap: 12px; margin-bottom: 12px; }
.chart h2, .list h2, .records h2 { font-size: 15px; margin: 0; font-weight: 600; }
.chart .head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.chart .cap { font-size: 12px; color: var(--muted); margin: 2px 0 8px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 12px; color: var(--ink-2); margin-bottom: 6px; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }
svg { display: block; width: 100%; overflow: visible; }
svg text { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
svg .lab { fill: var(--ink-2); font-size: 12px; font-variant-numeric: normal; }
svg .val { fill: var(--ink-2); font-size: 11px; }
svg .mark { cursor: pointer; }
svg g:has(.mark:hover) path, svg g:has(.mark:focus) path { opacity: .8; }
svg .mark:focus { outline: none; }
svg .dim { opacity: .35; }
.tview { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 8px; }
.tview th, .tview td { text-align: left; padding: 4px 6px; border-top: 1px solid var(--grid); }
.tview td.n { text-align: right; font-variant-numeric: tabular-nums; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--surface); border: 1px solid var(--ring); border-radius: 8px; padding: 8px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.18); max-width: 280px; }
#tip .v { font-weight: 600; font-size: 15px; color: var(--ink); }
#tip .k { color: var(--ink-2); }
#tip .trow { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
#tip .key { display: inline-block; width: 12px; height: 2px; margin-right: 6px; vertical-align: middle; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-bottom: 12px; }
@media (max-width: 640px) { .split { grid-template-columns: 1fr; } }
.party { text-align: left; cursor: pointer; }
.party.on { box-shadow: 0 0 0 2px var(--accent) inset; }
.party.off { opacity: .55; }
.party .phead { font-size: 15px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.party .sw { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.party .value { font-size: 40px; font-weight: 600; line-height: 1.15; }
.party .note { font-size: 13px; color: var(--ink-2); }
.party .top { font-size: 12px; color: var(--muted); margin-top: 4px; }
.split .rest { grid-column: 1 / -1; }
.lists { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 12px; margin-bottom: 12px; }
.row { display: grid; grid-template-columns: 1fr auto; gap: 8px; width: 100%; padding: 3px 6px; border: 0; background: none; text-align: left; cursor: pointer; border-radius: 6px; position: relative; }
.lists .row:hover, .lists .row:focus-visible { background: var(--wash); outline: none; }
.row .bar { position: absolute; left: 0; top: 2px; bottom: 2px; background: var(--wash); border-radius: 4px; }
.row span { position: relative; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .c { font-variant-numeric: tabular-nums; color: var(--ink-2); }
table.rec { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rec th, table.rec td { text-align: left; padding: 8px 6px; border-top: 1px solid var(--grid); vertical-align: top; }
table.rec th { color: var(--muted); font-weight: 500; font-size: 12px; border-top: 0; }
td.q { min-width: 260px; }
.tag { border: 1px solid var(--ring); background: var(--wash); border-radius: 6px; padding: 0 6px; cursor: pointer; font-size: 12px; white-space: nowrap; }
.dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 4px; }
a { color: var(--accent); }
.scroll { overflow-x: auto; }
.note { font-size: 13px; color: var(--ink-2); margin: 8px 0; }
@media (max-width: 640px) { .hide-sm { display: none; } td.q { min-width: 200px; } }
@media print { .filters, #morerows, .linkbtn { display: none; } .card { break-inside: avoid; } }
</style>
</head>
<body>
<form id="login" class="card" autocomplete="on">
  <h1>thEye</h1>
  <div class="sub">Reported economic and public-service problems in Uzbekistan</div>
  <label>Username<input id="u" name="username" autocomplete="username" required></label>
  <label>Password<input id="p" name="password" type="password" autocomplete="current-password" required></label>
  <button type="submit" id="go">Sign in</button>
  <div id="err" role="alert"></div>
</form>
<div id="app" class="wrap" hidden>
  <header><h1>thEye</h1><span class="sub">Reported economic and public-service problems in Uzbekistan</span><span class="muted" id="meta"></span></header>
  <div class="filters" id="filters"></div>
  <div class="kpis" id="kpis"></div>
  <div class="split" id="split"></div>
  <div class="charts">
    <section class="card chart" id="c-week"></section>
    <section class="card chart" id="c-sector"></section>
    <section class="card chart" id="c-channel"></section>
    <section class="card chart" id="c-service"></section>
  </div>
  <div class="lists" id="lists"></div>
  <section class="card records">
    <div class="chart"><div class="head"><h2>Records</h2><span class="muted" id="rcount"></span></div></div>
    <div class="scroll"><table class="rec"><thead><tr><th>Date</th><th>Affected</th><th>Channel</th><th>Sector</th><th class="hide-sm">Service / failure</th><th>Quote</th><th>Post</th></tr></thead><tbody id="rows"></tbody></table></div>
    <button class="linkbtn" id="morerows" hidden>Show 50 more</button>
  </section>
  <section class="card" style="margin-top:12px"><h2 style="font-size:15px;margin:0">How to read this</h2><div class="note" id="method"></div><div class="scroll" id="checks"></div></section>
</div>
<div id="tip" hidden></div>

// ---------- data helpers ----------
const LOWER = new Set(['service', 'failure', 'institution', 'location', 'affected']);
const mondayOf = day => { const d = new Date(day + 'T00:00:00Z'); d.setUTCDate(d.getUTCDate() - (d.getUTCDay() + 6) % 7); return d.toISOString().slice(0, 10); };
const key = (dim, r) => dim === 'week' ? mondayOf(r[F.day]) : LOWER.has(dim) ? r[F[dim]].toLowerCase() : r[F[dim]];
const SHORT = {S11: 'S11 Nonfinancial corp.', S12: 'S12 Financial corp.', S13: 'S13 General government', S14: 'S14 Households', S15: 'S15 Nonprofits (NPISH)', S2: 'S2 Rest of world', unknown: 'Unknown institution'};
function weekInfo(monday) {  // days of the calendar week inside the collected span
  const start = new Date(monday + 'T00:00:00Z'), first = new Date(D.span[0] + 'T00:00:00Z'), last = new Date(D.span[1] + 'T00:00:00Z');
  const end = new Date(start); end.setUTCDate(end.getUTCDate() + 6);
  const days = Math.max(0, (Math.min(end, last) - Math.max(start, first)) / 864e5 + 1);
  return {days, partial: days < 7};
}
const label = (dim, v) => v === '' ? '(not stated)' : dim === 'party' ? PARTY_NAME[v] : dim === 'week' ? `week of ${v}` : dim === 'sector' ? `${v} ${D.sectors[v] || ''}` : dim === 'check' ? v.replace('dropped: ', 'dropped, ').replace(/_/g, ' ') : v;
const rowsExcept = skip => D.records.filter(r => Object.entries(filters).every(([d, v]) => d === skip || key(d, r) === v));
const countBy = (rows, dim) => { const m = new Map(); for (const r of rows) m.set(key(dim, r), (m.get(key(dim, r)) || 0) + 1); return m; };
function postsRead(f = filters) {  // posts read under month/week/channel; other filters do not change the denominator
  let n = 0;
  for (const [k, c] of Object.entries(D.read)) {
    const [month, week, channel] = k.split('|');
    if ((!f.month || f.month === month) && (!f.week || f.week === mondayOf(week.slice(0, 10))) && (!f.channel || f.channel === channel)) n += c;
  }
  return n;
}
const fmt = n => n >= 1e4 ? (n / 1e3).toFixed(0) + 'K' : n >= 1e3 ? (n / 1e3).toFixed(1).replace('.0', '') + 'K' : String(Math.round(n * 10) / 10);
const niceMax = v => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)), s = [1, 2, 2.5, 5, 10].find(m => m * p >= v); return s * p; };
function toggle(dim, v) { if (filters[dim] === v) delete filters[dim]; else filters[dim] = v; shown = 50; render(); }

// ---------- tooltip ----------
const tip = document.getElementById('tip');
function showTip(ev, value, title, rows) {
  tip.replaceChildren();
  const v = document.createElement('div'); v.className = 'v'; v.textContent = value; tip.append(v);
  const t = document.createElement('div'); t.className = 'k'; t.textContent = title; tip.append(t);
  for (const [color, name, val] of rows || []) {
    const row = document.createElement('div'); row.className = 'trow';
    const left = document.createElement('span'); const k = document.createElement('i'); k.className = 'key'; k.style.background = color;
    left.append(k, document.createTextNode(name)); const right = document.createElement('b'); right.textContent = val;
    row.append(left, right); tip.append(row);
  }
  tip.hidden = false;
  const box = ev.target.getBoundingClientRect();
  const x = ev.clientX || (box.left + box.width / 2), y = ev.clientY || box.top;
  const w = tip.offsetWidth, h = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + 'px';
  tip.style.top = (y - h - 12 < 8 ? y + 16 : y - h - 12) + 'px';
}
const hideTip = () => { tip.hidden = true; };
const NS = 'http://www.w3.org/2000/svg';
const el = (name, attrs = {}, text) => { const n = document.createElementNS(NS, name); for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v); if (text != null) n.textContent = text; return n; };
// Bar with a 4px rounded data end and a square baseline end.
function barPath(x, y, w, h, horizontal, rounded = true) {
  if (w <= 0 || h <= 0) return '';
  const r = rounded ? Math.min(4, w / 2, h / 2) : 0;
  return horizontal
    ? `M${x},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h - r}Q${x + w},${y + h} ${x + w - r},${y + h}H${x}Z`
    : `M${x},${y + h}V${y + r}Q${x},${y} ${x + r},${y}H${x + w - r}Q${x + w},${y} ${x + w},${y + r}V${y + h}Z`;
}
function interactive(node, dim, value, tipArgs) {
  node.classList.add('mark'); node.setAttribute('tabindex', '0'); node.setAttribute('role', 'button');
  node.setAttribute('aria-label', `${tipArgs[1]}: ${tipArgs[0]}. Activate to filter.`);
  node.addEventListener('pointermove', ev => showTip(ev, ...tipArgs));
  node.addEventListener('pointerleave', hideTip); node.addEventListener('blur', hideTip);
  node.addEventListener('focus', ev => showTip(ev, ...tipArgs));
  node.addEventListener('click', () => { hideTip(); toggle(dim, value); });
  node.addEventListener('keydown', ev => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); hideTip(); toggle(dim, value); } });
}
// Card with title, caption, legend and a chart/table toggle (the table is the accessible twin of the chart).
function chartShell(id, title, caption, legend, table) {
  const box = document.getElementById(id); box.replaceChildren();
  const head = document.createElement('div'); head.className = 'head';
  const h = document.createElement('h2'); h.textContent = title;
  const btn = document.createElement('button'); btn.className = 'linkbtn'; btn.textContent = tables[id] ? 'Show chart' : 'Show table';
  btn.onclick = () => { tables[id] = !tables[id]; render(); };
  head.append(h, btn);
  const cap = document.createElement('div'); cap.className = 'cap'; cap.textContent = caption;
  box.append(head, cap);
  if (legend) {
    const lg = document.createElement('div'); lg.className = 'legend';
    for (const [color, name] of legend) { const s = document.createElement('span'); const i = document.createElement('i'); i.style.background = color; s.append(i, document.createTextNode(name)); lg.append(s); }
    box.append(lg);

  if (tables[id]) {

    t.append(hr);

// ---------- charts ----------
function weekChart() {
  const rows = rowsExcept('week');
  const weeks = [...new Set(D.records.filter(r => !filters.month || r[F.month] === filters.month).map(r => key('week', r)))].sort();
  const data = weeks.map(w => { const c = Object.fromEntries(PARTY.map(k => [k, 0])); for (const r of rows) if (key('week', r) === w) c[r[F.party]]++; return [w, c]; });
  const total = c => PARTY.reduce((a, k) => a + c[k], 0);
  const box = chartShell('c-week', 'Problems by week: households and businesses', 'Records per calendar week (Monday start, Tashkent), stacked by who is affected. * marks a week only partly collected. Click a week to filter.',
    PARTY.map(k => [PARTY_COLOR[k], PARTY_NAME[k]]),
    {head: ['Week of', 'Days collected', ...PARTY.map(k => PARTY_NAME[k]), 'Total', 'Per 100 posts'], rows: data.map(([w, c]) => { const read = postsRead({...filters, week: w}); return [w, weekInfo(w).days, ...PARTY.map(k => c[k]), total(c), read ? (100 * total(c) / read).toFixed(1) : '–']; })});
  if (!box) return;
  const W = Math.max(300, box.clientWidth - 32), H = 230, L = 34, B = 40, T = 14, plotH = H - B - T;
  const max = niceMax(Math.max(1, ...data.map(([, c]) => total(c))));
  const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': 'Stacked columns of problems per week by affected party'});
  for (let i = 0; i <= 4; i++) {
    const y = T + plotH - plotH * i / 4;
    svg.append(el('line', {x1: L, x2: W, y1: y, y2: y, stroke: i ? 'var(--grid)' : 'var(--axis)', 'stroke-width': 1}), el('text', {x: L - 6, y: y + 4, 'text-anchor': 'end'}, fmt(max * i / 4)));
  }
  const band = (W - L) / Math.max(1, data.length), bw = Math.min(24, band * 0.6);
  const every = Math.ceil(data.length / Math.max(1, Math.floor((W - L) / 44)));
  data.forEach(([w, c], i) => {
    const x = L + band * i + (band - bw) / 2, t = total(c), read = postsRead({...filters, week: w}), info = weekInfo(w);
    const g = el('g'); if (filters.week && filters.week !== w) g.setAttribute('class', 'dim');
    const segs = PARTY.filter(k => c[k] > 0); let y = T + plotH;
    segs.forEach((k, j) => {
      const h = plotH * c[k] / max, gap = j ? 2 : 0;  // 2px surface gap between stacked segments
      g.append(el('path', {d: barPath(x, y - h + gap, bw, h - gap, false, j === segs.length - 1), fill: PARTY_COLOR[k]}));
      y -= h;
    });
    if (t) g.append(el('text', {x: x + bw / 2, y: y - 4, 'text-anchor': 'middle', class: 'val'}, t));
    const hit = el('rect', {x: L + band * i, y: T, width: band, height: plotH + 18, fill: 'transparent'});
    interactive(hit, 'week', w, [`${t} problems`, `Week of ${w}${info.partial ? ` (partial: ${info.days} of 7 days)` : ''}${read ? ` · ${(100 * t / read).toFixed(1)} per 100 posts` : ''}`,
      PARTY.filter(k => c[k]).map(k => [PARTY_COLOR[k], PARTY_NAME[k], c[k]])]);
    g.append(hit); svg.append(g);
    if (i % every === 0) { const [, m, d] = w.split('-'); svg.append(el('text', {x: x + bw / 2, y: T + plotH + 16, 'text-anchor': 'middle'}, `${d}.${m}${info.partial ? '*' : ''}`)); }
  });
  svg.append(el('text', {x: L, y: H - 4}, 'Week starting (day.month)'));
  box.append(svg);
}

function hbarChart(id, dim, title, caption, items, color, valueText, tipTitle) {
  const box = chartShell(id, title, caption, null, {head: [NAMES[dim], 'Value'], rows: items.map(([k, v]) => [label(dim, k), valueText(v, k)])});
  if (!box) return;
  const rowH = 26, W = Math.max(300, box.clientWidth - 32), H = Math.max(rowH, items.length * rowH) + 4, labW = Math.min(190, W * 0.42), R = dim === 'channel' ? 96 : 46;
  const max = Math.max(...items.map(([, v]) => v), 1e-9);
  const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, height: H, role: 'img', 'aria-label': title});
  svg.append(el('line', {x1: labW, x2: labW, y1: 0, y2: H, stroke: 'var(--axis)', 'stroke-width': 1}));
  items.forEach(([k, v], i) => {

    g.append(el('text', {x: labW - 8, y: y + rowH / 2 + 4, 'text-anchor': 'end', class: 'lab'}, short));
    if (w) g.append(el('path', {d: barPath(labW, y + (rowH - bh) / 2, w, bh, true), fill: typeof color === 'function' ? color(k) : color}));
    g.append(el('text', {x: labW + w + 6, y: y + rowH / 2 + 4, class: 'val'}, valueText(v, k)));
    const hit = el('rect', {x: 0, y, width: W, height: rowH, fill: 'transparent'});
