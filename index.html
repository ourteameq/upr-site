:root {
  color-scheme: light;
  --page: #ffffff; --band: #eef2f7; --wash: #f4f6fa; --ink: #0f1d33; --ink-2: #45526a; --muted: #5d697d;
  --rule: #d3dae4; --grid: #e4e9f0; --navy: #1d5fa8; --amber: #c8711f; --teal: #2a9d8f; --other: #a3acb9; --bad: #c0392b;
  --zero: #eef2f7; --seq1: #d3e2f4; --seq2: #a3c3e8; --seq3: #6b9bd5; --seq4: #3a72bb; --seq5: #1b4c8a;
  --note: #fbf1e3; --note-ink: #6b3f0d; --shade: rgba(15, 29, 51, .16);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0e141d; --band: #172131; --wash: #151e2a; --ink: #e7ecf3; --ink-2: #b6c1d0; --muted: #98a4b6;
    --rule: #2b3749; --grid: #212d3d; --navy: #4a8ad4; --amber: #cf7f30; --teal: #2a9e90; --other: #5d6878; --bad: #e5675a;
    --zero: #18222f; --seq1: #1d3150; --seq2: #22487a; --seq3: #2d64a6; --seq4: #4a8ad4; --seq5: #8db8ea;
    --note: #2a2116; --note-ink: #f0c58e; --shade: rgba(0, 0, 0, .5);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0e141d; --band: #172131; --wash: #151e2a; --ink: #e7ecf3; --ink-2: #b6c1d0; --muted: #98a4b6;
  --rule: #2b3749; --grid: #212d3d; --navy: #4a8ad4; --amber: #cf7f30; --teal: #2a9e90; --other: #5d6878; --bad: #e5675a;
  --zero: #18222f; --seq1: #1d3150; --seq2: #22487a; --seq3: #2d64a6; --seq4: #4a8ad4; --seq5: #8db8ea;
  --note: #2a2116; --note-ink: #f0c58e; --shade: rgba(0, 0, 0, .5);
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--page); color: var(--ink); font: 15px/1.5 'Golos Text', system-ui, 'Segoe UI', sans-serif; font-variant-numeric: tabular-nums; }
::selection { background: var(--navy); color: var(--page); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--navy); outline-offset: 2px; border-radius: 2px; }
a { color: var(--navy); text-underline-offset: 3px; text-decoration-thickness: 1px; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 0 40px 64px; }
h1, h2, h3 { margin: 0; }

/* report head */
.head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 20px; padding: 28px 0 14px; border-bottom: 3px solid var(--navy); }
.head h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }
.head .period { color: var(--ink-2); font-size: 17px; }
.head .sp { flex: 1; }
.lang { display: inline-flex; gap: 2px; padding: 2px; background: var(--band); border-radius: 6px; }
.lang button { border: 0; background: none; padding: 4px 12px; border-radius: 4px; font-weight: 600; font-size: 13px; color: var(--ink-2); min-height: 32px; }
.lang button[aria-pressed="true"] { background: var(--page); color: var(--ink); box-shadow: 0 1px 2px var(--shade); }
.lede { margin: 14px 0 2px; font-size: 17px; }
.meta { margin: 0; color: var(--muted); font-size: 13px; }
.notice { display: flex; gap: 10px; align-items: flex-start; margin: 14px 0 0; padding: 10px 14px; background: var(--note); color: var(--note-ink); border-radius: 6px; font-size: 14px; }
.notice svg { flex: none; margin-top: 2px; }

/* summary band */
.summary { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 0 8px; margin: 20px -40px 0; padding: 6px 28px; background: var(--band); }
.sum { display: flex; flex-direction: column; justify-content: flex-start; padding: 12px 12px 14px; border: 0; background: none; text-align: left; }
.sum .k { order: 2; font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 6px; margin-top: 2px; }
.sum .k i { width: 10px; height: 10px; border-radius: 2px; display: inline-block; }
.sum .v { order: 1; display: block; font-size: 32px; font-weight: 700; letter-spacing: -.02em; line-height: 1.15; margin-top: 2px; }
.sum .d { order: 3; display: block; font-size: 13px; color: var(--ink-2); }
button.sum:hover { background: var(--wash); }
button.sum[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--navy); }

/* filter line */
.filterbar { position: sticky; top: 0; z-index: 5; background: var(--page); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; padding: 12px 0; margin-top: 8px; border-bottom: 1px solid var(--grid); min-height: 52px; font-size: 14px; }
.filterbar .hint { color: var(--muted); }
.filterbar .lab { font-weight: 600; }
.chip { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--band); border-radius: 4px; padding: 4px 6px 4px 10px; font-size: 13px; min-height: 30px; }
.chip b { font-weight: 600; }
.chip svg { opacity: .7; }
.chip:hover svg { opacity: 1; }
.chip.on { background: var(--navy); color: var(--page); }
.linkbtn { white-space: nowrap; border: 0; background: none; color: var(--navy); font-size: 13px; font-weight: 600; padding: 4px 2px; min-height: 30px; }
.linkbtn:hover { text-decoration: underline; text-underline-offset: 3px; }

/* figures */
.figs { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 44px 48px; margin-top: 32px; }
.fig { margin: 0; min-width: 0; animation: rise .5s cubic-bezier(.16, 1, .3, 1) both; animation-delay: calc(var(--i, 0) * 70ms); }
.fig.wide { grid-column: 1 / -1; }
@keyframes rise { from { opacity: 0; transform: translateY(12px); } }
@media (prefers-reduced-motion: reduce) { .fig { animation: none; } }
.fhead { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.fhead h2 { font-size: 17px; font-weight: 700; letter-spacing: -.005em; }
.fhead h2 .no { color: var(--navy); margin-right: 8px; }
.unit { margin: 4px 0 12px; color: var(--ink-2); font-size: 13px; max-width: 75ch; }
.src { margin: 10px 0 0; color: var(--muted); font-size: 12px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--ink-2); margin: 0 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i, .legend svg { width: 12px; height: 12px; border-radius: 2px; display: inline-block; flex: none; }
svg { display: block; overflow: visible; }
svg text { fill: var(--muted); font-size: 12px; font-family: inherit; }
svg .lab { fill: var(--ink); font-weight: 600; paint-order: stroke; stroke: var(--page); stroke-width: 3px; stroke-linejoin: round; }
svg .tot { fill: var(--ink-2); font-size: 12px; }
.mark { cursor: pointer; }
svg .mark:focus-visible { outline: none; stroke: var(--ink); stroke-width: 2px; }
.dim { opacity: .3; }

/* owner bars */
.bars { display: grid; gap: 2px; }
.brow { display: grid; grid-template-columns: minmax(0, 46%) minmax(0, 1fr) 44px; gap: 12px; align-items: center; width: 100%; border: 0; background: none; text-align: left; padding: 5px 6px; border-radius: 4px; min-height: 34px; }
.brow:hover { background: var(--wash); }
.brow .n { font-size: 14px; line-height: 1.3; }
.brow .n small { display: block; color: var(--muted); font-size: 12px; }
.brow .b { height: 12px; border-radius: 0 3px 3px 0; position: relative; }
.brow .b i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--navy); border-radius: 0 3px 3px 0; }
.brow .c { text-align: right; font-weight: 600; }
.brow.on { background: var(--band); }
.figfoot { display: flex; gap: 12px; align-items: center; margin-top: 6px; flex-wrap: wrap; }

/* map */
.mapsvg path.reg { stroke: var(--page); stroke-width: 1.5; }
.ramp { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--muted); margin-top: 8px; flex-wrap: wrap; }
.ramp i { width: 28px; height: 10px; display: inline-block; }
.places { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.place { border: 0; background: var(--band); border-radius: 4px; padding: 6px 12px; font-size: 13px; min-height: 32px; }
.place b { font-weight: 700; margin-left: 4px; }
.place[aria-pressed="true"] { box-shadow: inset 0 0 0 2px var(--navy); }

/* party */
.share { display: flex; height: 28px; gap: 2px; margin: 4px 0 14px; }
.share .seg { border: 0; padding: 0; min-width: 4px; }
.share .seg:first-child { border-radius: 3px 0 0 3px; }
.share .seg:last-child { border-radius: 0 3px 3px 0; }
.prow { display: grid; grid-template-columns: 14px minmax(0, 1fr) auto; gap: 4px 10px; align-items: baseline; width: 100%; border: 0; background: none; text-align: left; padding: 8px 6px; border-radius: 4px; border-top: 1px solid var(--grid); }
.prow:hover { background: var(--wash); }
.prow.on { background: var(--band); }
.prow i { width: 12px; height: 12px; border-radius: 2px; align-self: center; }
.prow .nm { font-weight: 600; }
.prow .ct { font-weight: 700; text-align: right; }
.prow .ct small { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.prow .top { grid-column: 2 / -1; font-size: 13px; color: var(--ink-2); }

/* small multiples */
.mult { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 210px), 1fr)); gap: 8px 16px; }
.mini { border: 0; background: none; text-align: left; padding: 8px 8px 6px; border-radius: 4px; border-top: 1px solid var(--grid); }
.mini:hover { background: var(--wash); }
.mini.on { background: var(--band); }
.mini .t { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; font-size: 13px; font-weight: 600; line-height: 1.3; min-height: 34px; }
.mini .t span:first-child { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.mini .t .tot { flex: none; color: var(--ink-2); font-weight: 600; }
.badge { flex: none; background: var(--bad); color: var(--page); border-radius: 3px; padding: 0 6px; font-size: 11px; font-weight: 700; line-height: 18px; }
.mini svg { width: 100%; height: 56px; margin-top: 4px; }
.mini .ax { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-top: 2px; }

/* tables */
.scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 600; font-size: 12px; color: var(--muted); padding: 6px 8px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
td { text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--grid); vertical-align: top; }
td.n, th.n { text-align: right; }
td.date { white-space: nowrap; color: var(--ink-2); }
td.q { min-width: 300px; max-width: 62ch; }
td.q .route.narrow { display: none; }
td.q .route { display: block; margin-top: 4px; color: var(--ink-2); font-size: 13px; }
.tag { border: 0; background: var(--band); border-radius: 4px; padding: 2px 8px; font-size: 13px; text-align: left; line-height: 1.35; min-height: 26px; }
.tag:hover { background: var(--grid); }
td.reg .tag, td.aff .tag { white-space: nowrap; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.qline { display: block; }
.qline + .qline { margin-top: 6px; padding-top: 6px; border-top: 1px dashed var(--grid); }
.tag .dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; }
.posts a { white-space: nowrap; }
.posts small { display: block; color: var(--muted); font-size: 12px; }
.more { margin-top: 10px; }

/* tooltip */
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--page); border-radius: 6px; padding: 8px 12px; font-size: 13px; box-shadow: 0 6px 24px var(--shade), 0 0 0 1px var(--rule); max-width: 300px; }
#tip .v { font-weight: 700; font-size: 15px; }
#tip .k { color: var(--ink-2); }

/* method */
.method { margin-top: 48px; padding-top: 20px; border-top: 3px solid var(--navy); max-width: 900px; }
.method h2 { font-size: 17px; }
.method p { color: var(--ink-2); font-size: 14px; max-width: 75ch; }
.method h3 { font-size: 14px; margin: 18px 0 6px; }

/* login */
.login { max-width: 420px; margin: 12vh auto 0; padding: 0 20px; }
.login .head { padding-top: 0; }
.login label { display: block; font-size: 13px; font-weight: 600; color: var(--ink-2); margin-top: 16px; }
.login input { width: 100%; padding: 10px 12px; margin-top: 6px; border: 1px solid var(--rule); border-radius: 4px; background: var(--page); min-height: 44px; }
.login input:focus-visible { outline: 2px solid var(--navy); outline-offset: 0; border-color: var(--navy); }
.login .go { width: 100%; margin-top: 20px; padding: 10px; border: 0; border-radius: 4px; background: var(--navy); color: var(--page); font-weight: 600; min-height: 44px; }
.login .go:disabled { opacity: .55; cursor: progress; }
#err { color: var(--bad); font-size: 13px; min-height: 1.5em; margin-top: 10px; }

@media (max-width: 1023px) { .figs { grid-template-columns: minmax(0, 1fr); } .summary { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 640px) {
  .wrap { padding: 0 16px 48px; }
  .head h1 { font-size: 26px; }
  .head .period { font-size: 15px; }
  .lede { font-size: 15px; }
  .summary { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .summary { margin: 20px -16px 0; padding: 4px 6px; }
  .sum { padding: 10px; }
  .mult { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px 10px; }
  .mini svg { height: 40px; }
  .sum:first-child { grid-column: 1 / -1; }
  .sum .v { font-size: 26px; }
  .figs { gap: 36px; }
  .brow { grid-template-columns: minmax(0, 1fr) 44px; }
  .brow .b { grid-column: 1 / -1; grid-row: 2; }
  .wideonly { display: none; }
  td.q .route.narrow { display: block; }
  table.stories thead { display: none; }
  table.stories tr { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; padding: 12px 0; border-bottom: 1px solid var(--grid); }
  table.stories td { border: 0; padding: 0; }
  table.stories td.q, table.stories td.posts { flex-basis: 100%; }
  table.stories td.q { min-width: 0; order: 2; }
  table.stories td.date { order: 0; }
  table.stories td.own { order: 1; }
  table.stories td.reg, table.stories td.aff { order: 3; }
  table.stories td.posts { order: 4; }
}
@media print { .filterbar, .lang, .linkbtn, .more { display: none; } .fig { break-inside: avoid; animation: none; } }
</style>
</head>

<form id="login" class="login" autocomplete="on">

  <p class="lede" data-i18n="lede"></p>

  <label><span data-i18n="password"></span><input id="p" name="password" type="password" autocomplete="current-password" required></label>

  <section class="method"><h2 data-i18n="methodTitle"></h2><p id="method"></p><h3 data-i18n="checksTitle"></h3><div class="scroll" id="checks"></div></section>
</div>

const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(user, pass) {
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(user + ':' + pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name: 'PBKDF2', salt: b64(SEALED.salt), iterations: SEALED.iterations, hash: 'SHA-256'},
                                            base, {name: 'AES-GCM', length: 256}, false, ['decrypt']);
  const plain = await crypto.subtle.decrypt({name: 'AES-GCM', iv: b64(SEALED.iv)}, key, b64(SEALED.data));
  return JSON.parse(await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text());
}

    err.textContent = ''; document.getElementById('login').hidden = true; document.getElementById('app').hidden = false; render();
  } catch (e) { err.textContent = e && e.name === 'OperationError' ? t('wrong') : t('openFail', e); console.error(e); }

// ---------- data helpers ----------
const num = n => { const s = Math.round(n).toLocaleString('en-US'); return LANG === 'uz' ? s.replace(/,/g, ' ') : s; };
const pct = (a, b) => b ? Math.round(100 * a / b) + '%' : '–';
const day = (iso, year) => { const [y, m, d] = iso.split('-').map(Number); return LANG === 'uz' ? `${d}-${MONTHS.uz[m - 1]}${year ? ' ' + y : ''}` : `${d} ${MONTHS.en[m - 1]}${year ? ' ' + y : ''}`; };
const ownerName = id => id === 'unclear' ? t('ownerUnclear') : (o => o ? (LANG === 'uz' && o.name_uz ? o.name_uz : o.name_en) : id)(OWN.get(id));
const regionName = r => REGION_NAME[LANG][r] || t(r) || r;
const partyName = p => t(p);
const value = (dim, r) => dim === 'strength' ? r.link_strength : dim === 'party' ? r.sparty : dim === 'origin' ? r.sorigin : r[dim];
const matches = (dim, v, r) => dim === 'channel' ? r.links.some(l => l.split('/')[0] === v) : value(dim, r) === v;
const rowsExcept = (...skip) => D.stories.filter(r => Object.entries(filters).every(([d, v]) => skip.includes(d) || matches(d, v, r)));
// Rows are story-owner pairs (reader/series.py kept_stories): a story with problems for several bodies has one row per
// body, carrying that body's first problem's quote, region and party.
// uniq counts each story once; uniqBy counts a story once under each distinct value it carries (two regions: once in each).
const uniq = rows => [...new Map(rows.map(r => [r.story, r])).values()];
const uniqBy = (rows, dim) => [...new Map(rows.map(r => [r.story + '|' + value(dim, r), r])).values()];
const byStory = rows => { const m = new Map(); for (const r of rows) { if (!m.has(r.story)) m.set(r.story, []); m.get(r.story).push(r); } return [...m.values()]; };
const distinct = (rows, dim) => [...new Set(rows.map(r => value(dim, r)))];
// One affected party per story: households and businesses together are Both; unclear gives way to any stated party.
function storyParty(rows) {
  const s = new Set(rows.map(r => r.party).filter(p => p !== 'unclear'));
  return !s.size ? 'unclear' : s.size === 1 ? [...s][0] : 'both';
}
const branchOf = id => { let o = OWN.get(id); if (!o) return 'unclear'; while (o.parent && OWN.get(o.parent)) o = OWN.get(o.parent); return o.id; };
const countBy = (rows, dim) => { const m = new Map(); for (const r of rows) m.set(value(dim, r), (m.get(value(dim, r)) || 0) + 1); return m; };
const label = (dim, v) => dim === 'area' || dim === 'owner' ? ownerName(v) : dim === 'region' ? regionName(v) : dim === 'party' ? partyName(v)
  : dim === 'week' ? t('weekOf', day(v)) : dim === 'origin' ? (v === 'foreign' ? t('foreignOrigin') : v) : dim === 'strength' ? t(v) : v === '' ? '–' : v;
function weekInfo(monday) {  // days of the calendar week inside the collected span
  const start = new Date(monday + 'T00:00:00Z'), first = new Date(D.span[0] + 'T00:00:00Z'), last = new Date(D.span[1] + 'T00:00:00Z');
  const end = new Date(start); end.setUTCDate(end.getUTCDate() + 6);
  return {days: Math.max(0, (Math.min(end, last) - Math.max(start, first)) / 864e5 + 1)};
}
// Same rule as reader/series.py: at least 4 earlier full weeks, count >= 3 and above their mean + 2*sqrt(mean).
// Partly collected weeks (D.partial) stay out of the baseline and are never flagged.
const spikeFlags = counts => counts.map((c, i) => {
  if (D.partial[i]) return false;
  const earlier = counts.slice(0, i).filter((_, j) => !D.partial[j]);
  if (earlier.length < 4) return false;
  const m = earlier.reduce((a, b) => a + b, 0) / earlier.length;
  return c >= 3 && c > m + 2 * Math.sqrt(m);
});
const fullWeeks = () => D.weeks.filter((_, i) => !D.partial[i]);
const weekly = rows => { const c = D.weeks.map(() => 0); for (const r of rows) { const i = D.weeks.indexOf(r.week); if (i >= 0) c[i]++; } return c; };
const quantile = (sorted, q) => { const i = (sorted.length - 1) * q, lo = Math.floor(i); return sorted[lo] + (sorted[Math.ceil(i)] - sorted[lo]) * (i - lo); };  // as d3.quantile
const niceMax = v => { if (v <= 0) return 1; const p = 10 ** Math.floor(Math.log10(v)), s = [1, 2, 2.5, 5, 10].find(m => m * p >= v); return s * p; };
function toggle(dim, v) { if (filters[dim] === v) delete filters[dim]; else filters[dim] = v; shown = 50; render(); }
const labelModels = () => D.models.filter(m => m.endsWith('(labels)')).map(m => m.replace(' (labels)', '').replace(/^gemini:/, '')).join(', ') || '–';

const tip = document.getElementById('tip');
function showTip(ev, value, title) {
  tip.replaceChildren(h('div', 'v', value), h('div', 'k', title)); tip.hidden = false;
  const box = ev.target.getBoundingClientRect();
  const x = ev.clientX || (box.left + box.width / 2), y = ev.clientY || box.top;
  const w = tip.offsetWidth, ht = tip.offsetHeight;
  tip.style.left = Math.min(window.innerWidth - w - 8, Math.max(8, x + 12)) + 'px';
  tip.style.top = (y - ht - 12 < 8 ? y + 16 : y - ht - 12) + 'px';
}

function interactive(node, dim, v, tipArgs) {
  node.classList.add('mark'); node.setAttribute('tabindex', '0'); node.setAttribute('role', 'button'); node.setAttribute('data-k', dim + '|' + v);
  node.setAttribute('aria-label', `${tipArgs[1]}: ${tipArgs[0]}. ${t('toFilter')}`);
  node.addEventListener('pointermove', ev => showTip(ev, ...tipArgs));
  node.addEventListener('pointerleave', hideTip); node.addEventListener('blur', hideTip);
  node.addEventListener('focus', ev => showTip(ev, ...tipArgs));
  node.addEventListener('click', ev => { ev.stopPropagation(); hideTip(); toggle(dim, v); });

// Figure shell: numbered title, chart/table switch, unit line, legend; the table is the accessible twin of the chart.
function figure(id, n, title, unit, legend, table) {
  const box = document.getElementById(id); box.replaceChildren();
  const head = h('div', 'fhead'), h2 = h('h2');
  h2.append(h('span', 'no', t('fig', n)), document.createTextNode(title));
  const btn = h('button', 'linkbtn', tables[id] ? t('showChart') : t('showTable'));
  btn.setAttribute('aria-pressed', String(!!tables[id])); btn.setAttribute('data-k', 'table|' + id);
  btn.onclick = () => { tables[id] = !tables[id]; render(); };
  head.append(h2, btn); box.append(head, h('p', 'unit', unit));
  if (legend && !tables[id]) {
    const lg = h('div', 'legend');
    for (const [fill, name] of legend) {
      const s = h('span');
      if (fill === 'hatch') s.innerHTML = '<svg viewBox="0 0 12 12"><rect width="12" height="12" fill="var(--navy)"/><rect width="12" height="12" fill="url(#hatch)"/></svg>';
      else { const i = h('i'); i.style.background = fill; s.append(i); }
      s.append(document.createTextNode(name)); lg.append(s);
    }
    box.append(lg);
  }
  if (tables[id]) {
    const wrap = h('div', 'scroll'), tb = h('table'), hr = h('tr');
    table.head.forEach((c, i) => hr.append(h('th', i ? 'n' : null, c)));
    const thead = h('thead'); thead.append(hr); tb.append(thead);
    const body = h('tbody');
    for (const row of table.rows) { const tr = h('tr'); row.forEach((c, i) => tr.append(h('td', i ? 'n' : null, String(c)))); body.append(tr); }
    tb.append(body); wrap.append(tb); box.append(wrap, h('p', 'src', t('source', labelModels())));
    return null;
  }
  return box;
}
const finish = box => box.append(h('p', 'src', t('source', labelModels())));

// ---------- Figure 1: weekly stories by affected party ----------
function figWeeks() {
  const rows = uniq(rowsExcept('week'));
  const series = PARTY.map(p => weekly(rows.filter(r => r.sparty === p)));
  const totals = D.weeks.map((_, i) => series.reduce((a, s) => a + s[i], 0));
  const box = figure('f-weeks', 1, t('f1'), t('f1u'), [...PARTY.map(p => [PARTY_COLOR[p], partyName(p)]), ['hatch', t('partial')]],
    {head: [t('colWeek'), ...PARTY.map(partyName), t('stories')], rows: D.weeks.map((w, i) => [day(w), ...series.map(s => s[i]), totals[i]])});
  if (!box) return;
  const W = width(box), H = W < 500 ? 220 : 300, top = 18, left = 30, bottom = 22, ph = H - top - bottom;
  const max = niceMax(Math.max(4, ...totals)), n = D.weeks.length, step = (W - left) / n, bw = Math.min(56, step * .7);
  const svg = el('svg', {width: W, height: H, viewBox: `0 0 ${W} ${H}`, role: 'group', 'aria-label': t('f1')});
  for (const f of [0, .5, 1]) {
    const y = top + ph * (1 - f);
    svg.append(el('line', {x1: left, x2: W, y1: y, y2: y, stroke: f ? 'var(--grid)' : 'var(--rule)'}), Number.isInteger(max * f) ? el('text', {x: left - 6, y: y + 4, 'text-anchor': 'end'}, num(max * f)) : '');
  }
  D.weeks.forEach((w, i) => {
    const x = left + i * step + (step - bw) / 2, g = el('g');
    if (filters.week && filters.week !== w) g.setAttribute('class', 'dim');
    let y = top + ph;
    series.forEach((s, k) => {
      if (!s[i]) return;
      const hgt = ph * s[i] / max, last = series.slice(k + 1).every(o => !o[i]);
      y -= hgt;
      const r = last ? Math.min(3, hgt) : 0;
      g.append(el('path', {d: `M${x},${y + hgt}V${y + r}Q${x},${y} ${x + r},${y}H${x + bw - r}Q${x + bw},${y} ${x + bw},${y + r}V${y + hgt}Z`, fill: PARTY_COLOR[PARTY[k]]}));
      if (D.partial[i]) g.append(el('rect', {x, y, width: bw, height: hgt, fill: 'url(#hatch)'}));
      y -= 2;  // 2px surface gap between stacked segments
    });
    if (totals[i]) g.append(el('text', {x: x + bw / 2, y: top + ph - ph * totals[i] / max - 2 * series.filter(s => s[i]).length - 4, 'text-anchor': 'middle', class: 'tot'}, num(totals[i])));
    if (i % Math.ceil(52 / step) === 0) g.append(el('text', {x: x + bw / 2, y: H - 6, 'text-anchor': 'middle'}, day(w)));
    const hit = el('rect', {x: left + i * step, y: 0, width: step, height: H, fill: 'transparent'});
    const info = weekInfo(w);
    interactive(hit, 'week', w, [t('nStories', totals[i]), t('weekOf', day(w)) + (D.partial[i] ? ` · ${t('partialDays', info.days)}` : '')]);
    g.append(hit); svg.append(g);
  });
  box.append(svg); finish(box);
}

// ---------- Figure 2: owners, ministry-level bodies drilling to their bodies ----------
function figOwner() {

  const all = rowsExcept('owner', 'area');
  if (drill) items = [...countBy(uniqBy(rowsExcept('owner'), 'owner'), 'owner')].map(([o, c]) => ({id: o, dim: 'owner', c}));
  else items = [...countBy(uniqBy(all, 'area'), 'area')].map(([a, c]) => ({id: a, dim: 'area', c}));
  items.sort((a, b) => b.c - a.c);
  // The table view lists every body with its ministry-level body, whatever the drill.
  const owners = [...countBy(uniqBy(all, 'owner'), 'owner')].sort((a, b) => b[1] - a[1]);
  const box = figure('f-owner', 2, t('f2'), drill ? t('f2b', ownerName(drill)) : t('f2u'), null,
    {head: [t('owner'), t('colArea'), t('colStories')], rows: owners.map(([o, c]) => [ownerName(o), ownerName(all.find(r => r.owner === o).area), c])});
  if (!box) return;
  if (!drill) {  // branch totals, each story once per branch
    const br = [...countBy(uniqBy(all.map(r => ({...r, branch: branchOf(r.owner)})), 'branch'), 'branch')].sort((a, b) => b[1] - a[1]);
    box.append(h('p', 'unit', `${t('byBranch')}: ` + br.map(([b, c]) => `${ownerName(b)} ${num(c)}`).join(' · ')));
  }
  const max = Math.max(1, ...items.map(i => i.c)), list = h('div', 'bars'), cap = allOwners ? items.length : 10;
  for (const it of items.slice(0, cap)) {
    const on = filters[it.dim] === it.id || (it.dim === 'area' && filters.owner && OWN.get(filters.owner) && all.some(r => r.owner === filters.owner && r.area === it.id)), b = h('button', 'brow' + (on ? ' on' : '') + (filters.owner && it.dim === 'owner' && !on ? ' dim' : ''));
    b.setAttribute('aria-pressed', String(on)); b.setAttribute('data-k', it.dim + '|' + it.id);
    const nm = h('span', 'n', ownerName(it.id));
    if (it.dim === 'area' && OWN.get(it.id)) { const parent = OWN.get(OWN.get(it.id).parent); if (parent && parent.id !== 'CAB') nm.append(h('small', null, ownerName(parent.id))); }
    const bar = h('span', 'b'), fill = h('i'); fill.style.width = (100 * it.c / max) + '%'; bar.append(fill);
    b.append(nm, bar, h('span', 'c', num(it.c)));
    b.onclick = () => toggle(it.dim, it.id);
    list.append(b);
  }
  box.append(list);
  const foot = h('div', 'figfoot');
  if (drill) { const back = h('button', 'linkbtn', '← ' + t('allAreas')); back.setAttribute('data-k', 'nav|back'); back.onclick = () => { delete filters.area; delete filters.owner; render(); }; foot.append(back); }
  if (items.length > 10) { const more = h('button', 'linkbtn', allOwners ? t('showFewer') : t('showAll', items.length)); more.setAttribute('data-k', 'nav|all'); more.onclick = () => { allOwners = !allOwners; render(); }; foot.append(more); }
  if (foot.childNodes.length) box.append(foot);
  box.append(h('p', 'src', t('modelNote')));
  finish(box);
}

// ---------- Figure 3: region map ----------
function figMap() {
  const rows = uniqBy(rowsExcept('region'), 'region'), counts = countBy(rows, 'region');
  const box = figure('f-map', 3, t('f3'), t('f3u'), null, {head: [t('region'), t('stories')], rows: D.regions.map(r => [regionName(r), counts.get(r) || 0])});
  if (!box) return;
  const vals = Object.keys(D.map.regions).map(r => counts.get(r) || 0), max = Math.max(1, ...vals);
  // Up to four quantile classes over the other regions with stories, and the largest region in a class of its own
  // (Tashkent city alone would flatten equal-width bins); 0 keeps the neutral ground.
  const pos = vals.filter(Boolean).sort((a, b) => a - b), rest = pos.slice(0, -1), top = pos[pos.length - 1];
  const lows = rest.length ? [...new Set([1, ...[.25, .5, .75].map(q => Math.ceil(quantile(rest, q)))])].sort((a, b) => a - b) : [];
  const classes = lows.map((lo, i) => [lo, i < lows.length - 1 ? lows[i + 1] - 1 : rest[rest.length - 1]]);
  if (top && (!rest.length || top > rest[rest.length - 1])) classes.push([rest.length ? rest[rest.length - 1] + 1 : 1, top]);
  const bin = n => classes.findIndex(([lo, hi]) => n >= lo && n <= hi);
  const W = width(box), Hh = W * D.map.height / D.map.width, fs = `font-size:${(13 * D.map.width / W).toFixed(1)}px`;
  const svg = el('svg', {width: W, height: Hh, viewBox: `0 0 ${D.map.width} ${D.map.height}`, class: 'mapsvg', role: 'group', 'aria-label': t('f3')});
  const labels = el('g');
  for (const [r, geo] of Object.entries(D.map.regions)) {
    const n = counts.get(r) || 0, g = el('g'); if (filters.region && filters.region !== r) g.setAttribute('class', 'dim');
    const path = el('path', {d: geo.d, 'fill-rule': 'evenodd', class: 'reg', fill: n ? SEQ[bin(n) + 5 - classes.length] : 'var(--zero)'});
    interactive(path, 'region', r, [t('nStories', n), regionName(r)]);
    g.append(path); svg.append(g);
    if (!n) continue;
    // Tashkent city sits inside Tashkent region: its count goes up and left on a leader line.
    if (r === 'R_TC') {
      labels.append(el('line', {x1: geo.cx, y1: geo.cy, x2: geo.cx - 30, y2: geo.cy - 52, stroke: 'var(--ink-2)', 'stroke-width': 1.2}),
                    el('text', {x: geo.cx - 32, y: geo.cy - 60, 'text-anchor': 'middle', class: 'lab', style: fs}, num(n)));
    } else labels.append(el('text', {x: geo.cx, y: geo.cy + 7, 'text-anchor': 'middle', class: 'lab', style: fs}, num(n)));
  }
  labels.setAttribute('pointer-events', 'none'); svg.append(labels);
  box.append(svg);
  const ramp = h('div', 'ramp'), zero = h('i'); zero.style.background = 'var(--zero)'; ramp.append(zero, document.createTextNode('0 '));
  classes.forEach(([lo, hi], i) => { const sw = h('i'); sw.style.background = SEQ[i + 5 - classes.length]; ramp.append(sw, document.createTextNode(lo === hi ? `${lo} ` : `${lo}–${hi} `)); });
  box.append(ramp);
  const places = h('div', 'places');
  for (const r of ['national', 'foreign', 'unknown']) {
    const b = h('button', 'place'); b.append(document.createTextNode(regionName(r)), h('b', null, num(counts.get(r) || 0)));
    b.setAttribute('aria-pressed', String(filters.region === r)); b.setAttribute('data-k', 'region|' + r); b.onclick = () => toggle('region', r); places.append(b);
  }
  box.append(places, h('p', 'src', t('source', labelModels()) + ' ' + t('bounds', D.map.source)));
}

// ---------- Figure 4: who is affected ----------
function figParty() {
  const rows = uniq(rowsExcept('party')), total = rows.length;
  const box = figure('f-party', 4, t('f4'), t('f4u'), null, {head: [t('party'), t('stories'), t('colShare')], rows: PARTY.map(p => { const c = rows.filter(r => r.sparty === p).length; return [partyName(p), c, pct(c, total)]; })});
  if (!box) return;
  const bar = h('div', 'share');
  for (const p of PARTY) {
    const c = rows.filter(r => r.sparty === p).length; if (!c) continue;
    const s = h('button', 'seg mark' + (filters.party && filters.party !== p ? ' dim' : '')); s.style.flex = String(c); s.style.background = PARTY_COLOR[p];
    s.setAttribute('aria-label', `${partyName(p)}: ${t('nStories', c)}, ${pct(c, total)}`); s.setAttribute('aria-pressed', String(filters.party === p)); s.setAttribute('data-k', 'seg|' + p);
    s.addEventListener('focus', ev => showTip(ev, `${pct(c, total)} · ${t('nStories', c)}`, partyName(p))); s.addEventListener('blur', hideTip);
    s.addEventListener('pointermove', ev => showTip(ev, `${pct(c, total)} · ${t('nStories', c)}`, partyName(p)));
    s.addEventListener('pointerleave', hideTip); s.onclick = () => { hideTip(); toggle('party', p); };
    bar.append(s);
  }
  box.append(bar);
  for (const p of PARTY) {
    const rs = rows.filter(r => r.sparty === p), on = filters.party === p;
    const b = h('button', 'prow' + (on ? ' on' : '') + (filters.party && !on ? ' dim' : '')); b.setAttribute('aria-pressed', String(on)); b.setAttribute('data-k', 'party|' + p);
    const sw = h('i'); sw.style.background = PARTY_COLOR[p];
    const ct = h('span', 'ct', num(rs.length)); ct.append(h('small', null, pct(rs.length, total)));
    const top = [...countBy(uniqBy(rowsExcept('party').filter(r => r.sparty === p), 'area'), 'area')].sort((a, b) => b[1] - a[1]).slice(0, 3);
    b.append(sw, h('span', 'nm', partyName(p)), ct, h('span', 'top', top.length ? `${t('mostly')}: ` + top.map(([a, c]) => `${ownerName(a)} (${num(c)})`).join(', ') : t('noStories')));
    b.onclick = () => toggle('party', p); box.append(b);
  }
  finish(box);
}

// ---------- Figure 5: spike panel, one small chart per problem area ----------
function figSpike() {
  const rows = uniqBy(rowsExcept('week', 'area'), 'area'), full = fullWeeks(), lastFull = full[full.length - 1], li = D.weeks.indexOf(lastFull);
  const areas = [...countBy(rows, 'area')].sort((a, b) => b[1] - a[1]);
  const data = areas.map(([a]) => { const c = weekly(rows.filter(r => r.area === a)); return [a, c, spikeFlags(c)]; });
  const box = figure('f-spike', 5, t('f5'), t('f5u', Math.max(0, full.length - 1)), [['var(--navy)', t('stories')], ['var(--bad)', t('spikeWeek')], ['hatch', t('partial')]],
    {head: [t('area'), ...D.weeks.map(w => day(w)), t('colSpike')], rows: data.map(([a, c, f]) => [ownerName(a), ...c, li >= 0 && f[li] ? t('yes') : ''])});
  if (!box) return;
  const grid = h('div', 'mult'), n = D.weeks.length, max = niceMax(Math.max(3, ...data.flatMap(d => d[1])));
  for (const [a, counts, flags] of data.slice(0, 24)) {
    const on = filters.area === a, card = h('button', 'mini' + (on ? ' on' : '') + (filters.area && !on ? ' dim' : ''));
    card.setAttribute('aria-pressed', String(on)); card.setAttribute('data-k', 'mini|' + a);
    const head = h('div', 't'); const nm = h('span', null, ownerName(a)); nm.title = ownerName(a); head.append(nm);
    const total = counts.reduce((x, y) => x + y, 0);
    head.append(li >= 0 && flags[li] ? h('span', 'badge', t('spike')) : h('span', 'tot', num(total)));
    card.append(head);
    // Shared y-scale across panels, so heights compare between areas.
    const W = 200, H = 56, bw = W / n;
    const svg = el('svg', {viewBox: `0 0 ${W} ${H}`, preserveAspectRatio: 'none', 'aria-hidden': 'true'});
    counts.forEach((c, i) => {
      if (!c) return;
      const bh = Math.max(2, H * c / max), x = i * bw + 1.5, g = el('g');
      if (filters.week && filters.week !== D.weeks[i]) g.setAttribute('class', 'dim');
      g.append(el('rect', {x, y: H - bh, width: bw - 3, height: bh, fill: flags[i] ? 'var(--bad)' : 'var(--navy)'}));
      if (D.partial[i]) g.append(el('rect', {x, y: H - bh, width: bw - 3, height: bh, fill: 'url(#hatch)'}));
      const note = flags[i] ? t('spikeWeek') : D.partial[i] ? t('partialDays', weekInfo(D.weeks[i]).days) : '';
      g.addEventListener('pointermove', ev => showTip(ev, t('nStories', c), `${ownerName(a)} · ${t('weekOf', day(D.weeks[i]))}${note ? ' · ' + note : ''}`));
      g.addEventListener('pointerleave', hideTip);
      svg.append(g);
    });
    svg.append(el('line', {x1: 0, x2: W, y1: H, y2: H, stroke: 'var(--rule)', 'vector-effect': 'non-scaling-stroke'}));
    card.append(svg);
    const ax = h('div', 'ax'); ax.append(h('span', null, day(D.weeks[0])), h('span', null, day(D.weeks[n - 1]))); card.append(ax);
    card.setAttribute('aria-label', `${ownerName(a)}: ${t('nStories', total)}${li >= 0 && flags[li] ? ', ' + t('spike') : ''}. ${t('toFilter')}`);
    card.onclick = () => toggle('area', a);
    grid.append(card);
  }
  box.append(grid);
  if (data.length > 24) box.append(h('p', 'src', t('smaller', data.length - 24)));
  finish(box);
}

// ---------- Figure 6: events abroad ----------
function figForeign() {
  const picked = rowsExcept('strength').filter(r => r.origin === 'foreign');
  const groups = [...new Set(picked.map(r => r.story))].map(id => STORY.get(id).filter(r => r.origin === 'foreign')).sort((a, b) => a[0].day < b[0].day ? 1 : -1);
  const rows = groups.map(g => ({...g[0], link: distinct(g, 'link').filter(Boolean).join(' / '), owners: distinct(g, 'owner').map(ownerName).join(', ')}));
  const box = figure('f-foreign', 6, t('f6'), t('f6u'), null, {head: [t('colDate'), t('colRoute'), t('colStrength'), t('owner')], rows: rows.map(r => [day(r.day), r.link || r.quote, r.link_strength ? t(r.link_strength) : '–', r.owners])});
  if (!box) return;
  const bar = h('div', 'places');
  for (const s of ['direct', 'indirect', 'speculative']) {
    const b = h('button', 'place'); b.append(document.createTextNode(t(s)), h('b', null, num(uniqBy(picked, 'strength').filter(r => r.link_strength === s).length)));
    b.setAttribute('aria-pressed', String(filters.strength === s)); b.setAttribute('data-k', 'strength|' + s); b.onclick = () => toggle('strength', s); bar.append(b);
  }
  box.append(bar);
  if (!rows.length) { box.append(h('p', 'unit', t('noForeign'))); return; }
  const wrap = h('div', 'scroll'), tb = h('table'), body = h('tbody'), hr = h('tr');
  [t('colDate'), t('colRoute'), t('colStrength'), t('owner')].forEach((c, i) => hr.append(h('th', i > 1 ? 'wideonly' : null, c)));
  const thead = h('thead'); thead.append(hr); tb.append(thead);
  for (const r of rows.slice(0, 12)) {
    const tr = h('tr'), s = r.link_strength ? t(r.link_strength) : '–', q = h('td', 'q', r.link || r.quote);
    q.append(h('span', 'route narrow', `${s} · ${r.owners}`));
    tr.append(h('td', 'date', day(r.day)), q, h('td', 'wideonly', s), h('td', 'wideonly', r.owners));
    body.append(tr);
  }
  tb.append(body); wrap.append(tb); box.append(wrap); finish(box);
}

// ---------- Table 1: stories ----------
function storyTable(rs) {
  // One row per story the filter selects, shown whole: each body's quote, every owner and region.
  const sorted = [...new Set(rs.map(r => r.story))].map(id => STORY.get(id)).sort((a, b) => a[0].day < b[0].day ? 1 : -1);
  document.getElementById('rcount').textContent = t('rcount', num(sorted.length));
  const body = document.getElementById('rows'); body.replaceChildren();
  const yearly = D.span[0].slice(0, 4) !== D.span[1].slice(0, 4);
  for (const g of sorted.slice(0, shown)) {
    const r = g[0], tr = h('tr');
    const td = (cls, content) => { const c = h('td', cls); if (content instanceof Node) c.append(content); else c.textContent = content; tr.append(c); return c; };
    const tag = (dim, v, text, dot) => { const b = h('button', 'tag'); b.setAttribute('data-k', 'tag|' + dim + '|' + v); if (dot) { const d = h('i', 'dot'); d.style.background = dot; b.append(d); } b.append(document.createTextNode(text)); b.onclick = () => toggle(dim, v); return b; };
    const tags = (dim, name) => { const box = h('div', 'tags'); for (const v of distinct(g, dim)) box.append(tag(dim, v, name(v))); return box; };
    td('date', day(r.day, yearly));
    const q = td('q', null);
    distinct(g, 'quote').forEach(text => q.append(h('span', 'qline', text)));
    for (const link of distinct(g.filter(x => x.origin === 'foreign'), 'link').filter(Boolean)) q.append(h('span', 'route', `${t('route')} ${link}`));
    td('own', tags('owner', ownerName));
    td('reg', tags('region', regionName));
    td('aff', tag('party', r.sparty, partyName(r.sparty), PARTY_COLOR[r.sparty]));
    const links = h('div');
    r.links.slice(0, 4).forEach((l, i) => { const a = h('a', null, l.split('/')[0]); a.href = 'https://t.me/' + l.split('/').map(encodeURIComponent).join('/'); a.target = '_blank'; a.rel = 'noopener noreferrer'; if (i) links.append(document.createTextNode(', ')); links.append(a); });
    if (r.links.length > 4) links.append(document.createTextNode(` +${r.links.length - 4}`));
    if (r.channels > 1) links.append(h('small', null, t('channels', r.channels)));
    td('posts', links);
    body.append(tr);
  }
  const more = document.getElementById('morerows'); more.hidden = shown >= sorted.length; more.onclick = () => { shown += 50; render(); };
}

function render() {
  // Every click re-renders the page; keep keyboard focus on the same control.
  const ae = document.activeElement, fk = ae && ae.getAttribute && ae.getAttribute('data-k'), ffig = fk && ae.closest('.fig, #filters') && ae.closest('.fig, #filters').id;
  const rs = D.stories.filter(r => Object.entries(filters).every(([d, v]) => matches(d, v, r)));
  document.getElementById('period').textContent = `${day(D.span[0], true)} – ${day(D.span[1], true)}`;
  document.getElementById('meta').textContent = t('updated', D.generated, D.models.join(', '));
  const waiting = [D.unclassified ? t('waitExtract', num(D.unclassified)) : '', D.unlabelled ? t('waitLabel', num(D.unlabelled)) : ''].filter(Boolean);
  const notice = document.getElementById('notice'); notice.hidden = !waiting.length;
  if (waiting.length) { notice.innerHTML = NOTE_ICON; notice.append(h('span', null, t('incomplete', waiting.join('; ')))); }

  // summary band
  const us = uniq(rs), all = us.length, posts = us.reduce((a, r) => a + r.links.length, 0);
  // Shares are taken without their own filter, so clicking Households does not turn it into 100%.
  const byParty = uniq(rowsExcept('party')), byOrigin = uniq(rowsExcept('origin'));
  const read = Object.values(D.read).reduce((a, w) => a + Object.values(w).reduce((x, y) => x + y, 0), 0);
  const full = fullWeeks(), lastFull = full[full.length - 1], li = D.weeks.indexOf(lastFull);
  const base = uniqBy(rowsExcept('week', 'area'), 'area');
  const spiking = li < 0 ? [] : [...countBy(base, 'area').keys()].filter(a => spikeFlags(weekly(base.filter(r => r.area === a)))[li]);
  const kr = document.getElementById('kpis'); kr.replaceChildren();
  const sum = (tag, k, v, d, swatch) => { const n = h(tag, 'sum'), kk = h('span', 'k'); if (swatch) { const i = h('i'); i.style.background = swatch; kk.append(i); } kk.append(document.createTextNode(k)); n.append(kk, h('span', 'v', v), h('span', 'd', d)); kr.append(n); return n; };
  sum('div', t('stories'), num(all), t('storiesNote', num(posts), num(read)));
  for (const p of ['households', 'businesses']) {
    const c = byParty.filter(r => r.sparty === p).length, b = sum('button', partyName(p), pct(c, byParty.length), t('ofStories', num(c)), PARTY_COLOR[p]);
    b.setAttribute('aria-pressed', String(filters.party === p)); b.setAttribute('data-k', 'sum|party|' + p); b.onclick = () => toggle('party', p);
  }
  const fc = byOrigin.filter(r => r.sorigin === 'foreign').length, fb = sum('button', t('abroad'), pct(fc, byOrigin.length), t('abroadNote', num(fc)));
  fb.setAttribute('aria-pressed', String(filters.origin === 'foreign')); fb.setAttribute('data-k', 'sum|origin'); fb.onclick = () => toggle('origin', 'foreign');
  const sp = sum('div', t('spikes'), num(spiking.length), lastFull ? t('spikesIn', day(lastFull)) + (spiking.length ? ': ' + spiking.map(ownerName).join(', ') : '') : t('noFullWeek'));
  if (spiking.length) sp.querySelector('.v').style.color = 'var(--bad)';

  // filter line
  const fr = document.getElementById('filters'); fr.replaceChildren();
  const active = Object.entries(filters);
  if (active.length) {
    fr.append(h('span', 'lab', t('filtered') + ':'));
    for (const [d, v] of active) {
      const b = h('button', 'chip'); b.setAttribute('data-k', 'chip|' + d); b.append(document.createTextNode(t(d) + ': '), h('b', null, label(d, v)));
      b.insertAdjacentHTML('beforeend', X_ICON); b.setAttribute('aria-label', t('remove', label(d, v)));
      b.onclick = () => { delete filters[d]; render(); }; fr.append(b);
    }
    const c = h('button', 'linkbtn', t('clear')); c.onclick = () => { filters = {}; render(); }; fr.append(c);
  } else fr.append(h('span', 'hint', t('hint')));

  figWeeks(); figOwner(); figMap(); figParty(); figSpike(); figForeign(); storyTable(rs);

  document.getElementById('method').textContent = t('method');
  const ct = document.getElementById('checks'); ct.replaceChildren();
  const tb = h('table'), thead = h('thead'), hr = h('tr');
  [t('cSample'), t('cPosts'), t('cPositive'), t('cPrecision'), t('cRecall')].forEach((c, i) => hr.append(h('th', i ? 'n' : null, c)));
  thead.append(hr); tb.append(thead);
  const body = h('tbody');
  const dec = v => LANG === 'uz' ? v.replace('.', ',') : v;
  for (const c of D.checks) {
    const tr = h('tr');
    [[c.sample, 0], [num(c.posts), 1], [num(c.positive), 1], [c.tp + c.fp ? dec((c.tp / (c.tp + c.fp)).toFixed(2)) : '–', 1], [c.tp + c.fn ? dec((c.tp / (c.tp + c.fn)).toFixed(2)) : '–', 1]]
      .forEach(([v, n]) => tr.append(h('td', n ? 'n' : null, String(v))));
    body.append(tr);
  }
  tb.append(body); ct.append(tb);
  if (fk) { const n = document.querySelector(`[data-k="${CSS.escape(fk)}"]`) || (ffig && document.querySelector(`#${ffig} [data-k]:not([data-k^="table|"])`)); if (n) n.focus({preventScroll: true}); }
}
setLang(LANG);
let resizeTimer, lastW = window.innerWidth;
window.addEventListener('resize', () => { if (window.innerWidth === lastW) return; lastW = window.innerWidth; clearTimeout(resizeTimer); resizeTimer = setTimeout(() => D && render(), 150); });
</script>
